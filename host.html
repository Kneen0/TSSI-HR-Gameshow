<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host · The Big HR Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="host">
  <div id="splash" class="splash">
    <div class="card splash-card">
      <div class="marquee-title"><span id="splashTitle"></span></div>
      <h1 class="show-name">THE BIG <em>HR</em> GAME SHOW</h1>
      <p>This is the <b>host screen</b>. Share this window on your call with <b>computer sound ON</b>.</p>
      <button id="btnNew" class="btn big">🎬 Open the studio doors</button>
      <button id="btnResume" class="btn ghost" hidden></button>
      <p id="splashMode" class="hint"></p>
      <p class="hint">Keys: <kbd>Space</kbd>/<kbd>→</kbd> next · <kbd>←</kbd> back · <kbd>T</kbd> talk (fade music) · <kbd>M</kbd> mute · <kbd>H</kbd> hide controls · <kbd>F</kbd> fullscreen</p>
    </div>
  </div>

  <main id="stage" class="stage"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav id="controls" class="controls">
    <span class="ctl-room" title="Room code · players connected">Room <b id="ctlRoom">----</b> · <b id="ctlPlayers">0</b> 👥</span>
    <span id="ctlConn" class="ctl-conn"></span>
    <span id="ctlMode" class="ctl-mode"></span>
    <span id="ctlClock" class="ctl-clock"></span>
    <span class="ctl-grow"></span>
    <button id="ctlLink" class="btn small ghost" title="Copy the players' join link">🔗 Join link</button>
    <select id="ctlJump" title="Jump to any screen"></select>
    <button id="ctlTalk" class="btn small ghost" title="Fade the music out so people can hear you (T)">🎙 Talk</button>
    <button id="ctlMusic" class="btn small ghost" title="Music mode"></button>
    <button id="ctlMute" class="btn small ghost icon" title="Mute (M)">🔊</button>
    <input id="ctlVol" type="range" min="0" max="1" step="0.05" value="0.7" title="Volume">
    <button id="ctlPrev" class="btn small ghost icon" title="Back (←)">◀</button>
    <button id="ctlNext" class="btn small next" title="Next (Space or →)">Next ▶</button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/common.js"></script>
  <script src="js/music.js"></script>
  <script src="js/wall.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/host.js"></script>
</body>
</html>
